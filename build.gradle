plugins { id 'com.android.application' version '8.11.0' }
android {
    namespace 'io.hiddemoens.pluskey'
    compileSdk 37
    defaultConfig { applicationId 'io.hiddemoens.pluskey'; minSdk 30; targetSdk 37; versionCode 31; versionName '1.9.6' }
    buildFeatures { buildConfig true }
    sourceSets {
        main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src', 'vendor/libadb/src']; res.srcDirs = ['res']; jniLibs.srcDirs = ['deps/native'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging true }; resources { excludes += ['META-INF/versions/**', 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES'] } }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.google.android.material:material:1.14.0'
    implementation fileTree(dir: 'deps', include: ['*.jar'], exclude: ['annotation-*.jar'])
}
